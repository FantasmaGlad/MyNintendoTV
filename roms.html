<!DOCTYPE html>
<html lang="fr" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console - Importation & Maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1222;
            --text-color: #e2e8f0;
            --light-blue: #93b1eb;
            --glass-bg: rgba(19, 27, 49, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-drag: none;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #060913;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--text-color);
        }

        /* 16:9 Premium Container */
        .console-container {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* 16:9 */
            max-height: 100vh;
            max-width: 177.78vh;
            background-color: var(--bg-color);
            overflow: hidden;
            box-shadow: 0 35px 90px rgba(0, 0, 0, 0.85), 0 0 60px rgba(79, 115, 195, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3% 4%;
        }

        /* Background matching the main page */
        .console-background {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('Assets/Images/FondPoly.png') no-repeat center center;
            background-size: cover;
            z-index: 0;
            filter: brightness(0.92) contrast(1.05);
        }

        .console-background::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 35%, rgba(6, 9, 19, 0.75) 100%);
            pointer-events: none;
        }

        .content-area {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Bar with Maintenance Buttons */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .maintenance-group {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .maintenance-btn {
            width: 72px;
            height: 72px;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: visible;
            padding: 0;
            outline: none;
        }

        .maintenance-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.3s ease;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.55));
        }

        .maintenance-btn:hover img {
            transform: scale(1.15);
            filter: drop-shadow(0 15px 30px rgba(79, 115, 195, 0.65)) brightness(1.15);
        }

        .maintenance-btn:active img {
            transform: scale(0.92);
        }

        /* Back to menu button */
        .back-btn {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            background: rgba(59, 92, 176, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 12px 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: rgba(59, 92, 176, 0.65);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 20px rgba(79, 115, 195, 0.4);
        }

        .back-btn:active {
            transform: translateY(0);
        }

        /* Central Drop & Click Area */
        .center-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-top: -2%;
        }

        .upload-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .chest-img-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .chest-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.65));
            transition: filter 0.4s ease;
        }

        .upload-card:hover .chest-img-wrapper {
            transform: scale(1.08) translateY(-10px);
        }

        .upload-card:hover .chest-img-wrapper img {
            filter: drop-shadow(0 20px 45px rgba(79, 115, 195, 0.5)) brightness(1.08);
        }

        .upload-card:active .chest-img-wrapper {
            transform: scale(0.98) translateY(0);
            transition: transform 0.1s ease;
        }

        .upload-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
            text-align: center;
            margin-top: 20px;
            letter-spacing: 0.5px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: color 0.3s ease;
        }

        .upload-subtitle {
            font-size: 1rem;
            color: var(--light-blue);
            margin-top: 8px;
            font-weight: 500;
            text-shadow: 0 2px 5px rgba(0,0,0,0.4);
            opacity: 0.85;
        }

        .upload-card:hover .upload-title {
            color: #b0c9ff;
        }

        /* Drag over state */
        .upload-card.dragover {
            transform: scale(1.05);
        }

        .upload-card.dragover .chest-img-wrapper img {
            filter: drop-shadow(0 25px 50px rgba(16, 185, 129, 0.6)) brightness(1.15);
        }

        /* Glassmorphic Loader & Notification Overlay */
        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(6, 9, 19, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 26px;
            width: 82%;
            max-width: 500px;
            padding: 40px;
            box-shadow: 0 40px 90px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            transform: scale(0.88) translateY(30px);
            transition: transform 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.2);
            color: #0b0f19;
        }

        .modal-card.active {
            transform: scale(1) translateY(0);
        }

        .modal-icon {
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(59, 92, 176, 0.1);
            padding: 20px;
            border-radius: 50%;
            border: 1.5px solid rgba(59, 92, 176, 0.15);
            color: #3b5cb0;
        }

        .modal-icon.success {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.15);
            color: var(--success-color);
        }

        .modal-icon.error {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.15);
            color: var(--error-color);
        }

        .modal-text {
            font-size: 1.1rem;
            color: #2d3748;
            text-align: center;
            line-height: 1.6;
            font-weight: 600;
        }

        /* Custom Progress Bar */
        .progress-container {
            width: 100%;
            background: rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            height: 14px;
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.05);
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b5cb0, #4f73c3);
            border-radius: 12px;
            transition: width 0.1s ease;
            box-shadow: 0 0 10px rgba(79, 115, 195, 0.4);
        }

        .modal-btn {
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            background-color: #3b5cb0;
            border: none;
            border-radius: 14px;
            padding: 12px 36px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(59, 92, 176, 0.3);
            outline: none;
        }

        .modal-btn:hover {
            background-color: #4f73c3;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 115, 195, 0.4);
        }

        .modal-btn:active {
            transform: scale(0.96) translateY(0);
        }

        /* Spinner */
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(59, 92, 176, 0.15);
            border-top: 5px solid #3b5cb0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="console-container">
        <!-- Unified Premium Background -->
        <div class="console-background"></div>

        <div class="content-area">
            <!-- Top Bar with Left Aligned Maintenance Buttons -->
            <div class="top-bar">
                <div class="maintenance-group">
                    <!-- Shutdown Button -->
                    <button class="maintenance-btn" id="btn-shutdown" aria-label="Éteindre la console">
                        <img src="Assets/Images/off.png" alt="Éteindre">
                    </button>
                    <!-- Wake Screen Button -->
                    <button class="maintenance-btn" id="btn-wake" aria-label="Allumer la console / Réveiller l'écran">
                        <img src="Assets/Images/on.png" alt="Allumer">
                    </button>
                    <!-- Reboot Button -->
                    <button class="maintenance-btn" id="btn-reboot" aria-label="Redémarrer la console">
                        <img src="Assets/Images/restart.png" alt="Redémarrer">
                    </button>
                </div>
            </div>

            <!-- Central Drag & Click ROM Upload Area -->
            <div class="center-area">
                <div class="upload-card" id="upload-zone">
                    <div class="chest-img-wrapper">
                        <img src="Assets/Images/coffrepoly.png" alt="Coffre d'importation de ROMs">
                    </div>
                </div>
                <input type="file" id="file-input" accept=".zip,.nds" multiple style="display: none;">
            </div>
        </div>
    </div>

    <!-- Glassmorphic Modal Overlay for Loading and Notifications -->
    <div class="overlay" id="modal-overlay">
        <div class="modal-card" id="modal-card">
            <!-- Icon area -->
            <div class="modal-icon" id="modal-icon-container">
                <div class="spinner" id="modal-spinner"></div>
                <!-- Icons injected dynamically -->
            </div>
            <!-- Message text -->
            <div class="modal-text" id="modal-message">Envoi du jeu en cours...</div>
            
            <!-- Progress bar container -->
            <div class="progress-container" id="progress-container" style="display: none;">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <!-- Dismiss button -->
            <button class="modal-btn" id="modal-close-btn" style="display: none;">OK</button>
        </div>
    </div>

    <script>
        // Résolution dynamique des chemins d'accès aux images (file:// vs http://)
        (() => {
            const isLocal = window.location.protocol === 'file:';
            const baseDir = isLocal ? 'Assets/Images/' : '/Assets/Images/';
            
            // Mise à jour de l'arrière-plan
            const bgEl = document.querySelector('.console-background');
            if (bgEl) {
                bgEl.style.backgroundImage = `url('${baseDir}FondPoly.png')`;
            }
            
            // Correspondance des images avec les éléments HTML
            const imgMapping = {
                'btn-shutdown': 'off.png',
                'btn-wake': 'on.png',
                'btn-reboot': 'restart.png'
            };
            
            // Mise à jour des icônes des boutons
            document.querySelectorAll('.maintenance-btn img').forEach(img => {
                const btn = img.closest('button');
                if (btn && imgMapping[btn.id]) {
                    img.src = baseDir + imgMapping[btn.id];
                }
            });
            
            // Mise à jour de l'image du coffre
            const chestImg = document.querySelector('.chest-img-wrapper img');
            if (chestImg) {
                chestImg.src = baseDir + 'coffrepoly.png';
            }
        })();

        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalCard = document.getElementById('modal-card');
        const modalMessage = document.getElementById('modal-message');
        const modalIconContainer = document.getElementById('modal-icon-container');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        // Setup File input trigger
        uploadZone.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                queueUploads(e.target.files);
            }
        });

        // Setup Drag & Drop events
        ['dragenter', 'dragover'].forEach(eventName => {
            uploadZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                uploadZone.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                uploadZone.classList.remove('dragover');
            }, false);
        });

        // Parsing récursif pour les glisser-déposer de dossiers et fichiers
        async function parseDroppedEntries(dataTransfer) {
            const files = [];
            const queue = [];
            
            if (dataTransfer.items) {
                for (let i = 0; i < dataTransfer.items.length; i++) {
                    const item = dataTransfer.items[i];
                    if (item.kind === 'file') {
                        const entry = item.webkitGetAsEntry();
                        if (entry) {
                            queue.push(entry);
                        }
                    }
                }
            } else {
                return Array.from(dataTransfer.files);
            }
            
            async function readEntry(entry) {
                if (entry.isFile) {
                    const file = await new Promise((resolve) => entry.file(resolve));
                    files.push(file);
                } else if (entry.isDirectory) {
                    const dirReader = entry.createReader();
                    const entries = await new Promise((resolve) => {
                        dirReader.readEntries(resolve);
                    });
                    for (const childEntry of entries) {
                        await readEntry(childEntry);
                    }
                }
            }
            
            while (queue.length > 0) {
                const entry = queue.shift();
                await readEntry(entry);
            }
            
            return files;
        }

        uploadZone.addEventListener('drop', async (e) => {
            const dt = e.dataTransfer;
            const files = await parseDroppedEntries(dt);
            if (files.length > 0) {
                queueUploads(files);
            }
        });

        // Maintenance Buttons
        document.getElementById('btn-shutdown').addEventListener('click', () => {
            showMaintenanceModal('Éteindre', 'Lancement de l\'extinction de la console...', '/api/system/shutdown');
        });

        document.getElementById('btn-wake').addEventListener('click', () => {
            showMaintenanceModal('Allumer', 'Réveil de l\'écran de la console...', '/api/system/wake');
        });

        document.getElementById('btn-reboot').addEventListener('click', () => {
            showMaintenanceModal('Redémarrer', 'Lancement du redémarrage de la console...', '/api/system/reboot');
        });

        function showMaintenanceModal(title, message, endpoint) {
            // Activer l'overlay de chargement
            modalOverlay.classList.add('active');
            modalCard.classList.add('active');
            
            modalIconContainer.innerHTML = '<div class="spinner"></div>';
            modalMessage.textContent = message;
            progressContainer.style.display = 'none';
            modalCloseBtn.style.display = 'none';

            fetch(endpoint, { method: 'POST' })
                .then(res => {
                    if (res.ok) {
                        setTimeout(() => {
                            modalIconContainer.innerHTML = `
                                <div class="modal-icon success">
                                    <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="20 6 9 17 4 12"/>
                                    </svg>
                                </div>
                            `;
                            modalMessage.textContent = `Action "${title}" exécutée avec succès !`;
                            modalCloseBtn.style.display = 'block';
                        }, 1200);
                    } else {
                        throw new Error('Erreur de communication avec le serveur.');
                    }
                })
                .catch(err => {
                    modalIconContainer.innerHTML = `
                        <div class="modal-icon error">
                            <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"/>
                                <line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                        </div>
                    `;
                    modalMessage.textContent = `Échec de l'action "${title}" : ${err.message}`;
                    modalCloseBtn.style.display = 'block';
                });
        }

        // Close modal trigger
        modalCloseBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
            modalCard.classList.remove('active');
            // Réinitialiser la sélection de fichier
            fileInput.value = '';
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay && modalCloseBtn.style.display === 'block') {
                modalOverlay.classList.remove('active');
                modalCard.classList.remove('active');
                fileInput.value = '';
            }
        });

        // Queue and Upload system with progress
        let uploadQueue = [];
        let totalFilesToUpload = 0;
        let currentFileIndex = 0;
        let isUploading = false;

        function queueUploads(files) {
            const validFiles = Array.from(files).filter(file => {
                const ext = file.name.split('.').pop().toLowerCase();
                return ext === 'nds' || ext === 'zip';
            });

            if (validFiles.length === 0) {
                showModalError("Aucun fichier valide (.nds ou .zip) trouvé.");
                return;
            }

            uploadQueue = uploadQueue.concat(validFiles);
            totalFilesToUpload = uploadQueue.length;
            
            if (!isUploading) {
                currentFileIndex = 0;
                processNextUpload();
            }
        }

        function showModalError(message) {
            modalOverlay.classList.add('active');
            modalCard.classList.add('active');
            modalIconContainer.innerHTML = `
                <div class="modal-icon error">
                    <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </div>
            `;
            modalMessage.textContent = message;
            progressContainer.style.display = 'none';
            modalCloseBtn.style.display = 'block';
        }

        function processNextUpload() {
            if (uploadQueue.length === 0) {
                isUploading = false;
                modalIconContainer.innerHTML = `
                    <div class="modal-icon success">
                        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>
                `;
                modalMessage.textContent = `${totalFilesToUpload} jeu(x) importé(s) avec succès !`;
                progressContainer.style.display = 'none';
                modalCloseBtn.style.display = 'block';
                return;
            }

            isUploading = true;
            const file = uploadQueue.shift();
            currentFileIndex++;

            modalOverlay.classList.add('active');
            modalCard.classList.add('active');
            
            modalIconContainer.innerHTML = '<div class="spinner"></div>';
            modalMessage.textContent = `Importation [${currentFileIndex}/${totalFilesToUpload}] : ${file.name}...`;
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';
            modalCloseBtn.style.display = 'none';

            const xhr = new XMLHttpRequest();
            const formData = new FormData();
            formData.append('file', file);

            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    progressBar.style.width = `${percent}%`;
                    modalMessage.textContent = `Envoi [${currentFileIndex}/${totalFilesToUpload}] : ${percent}% (${file.name})`;
                }
            });

            xhr.addEventListener('load', () => {
                if (xhr.status === 200) {
                    setTimeout(processNextUpload, 300);
                } else {
                    isUploading = false;
                    uploadQueue = [];
                    showModalError(`Échec lors de l'importation de ${file.name} : ${xhr.responseText || 'Erreur serveur.'}`);
                }
            });

            xhr.addEventListener('error', () => {
                isUploading = false;
                uploadQueue = [];
                showModalError("Erreur de connexion réseau lors du transfert.");
            });

            xhr.open('POST', '/api/upload');
            xhr.send(formData);
        }
    </script>
</body>
</html>
